name: Test and deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

# One deployment at a time. A run in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # react-scripts only declares support for TypeScript 4 as a peer.
      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
